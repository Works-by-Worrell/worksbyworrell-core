[project]
name = "worksbyworrell-core"
version = "0.1.2"
description = "Core library for Works by Worrell agents and MCP tools"
readme = "README.md"
authors = [
    { name = "Roger Worrell", email = "raworre@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worksbyworrell"]
